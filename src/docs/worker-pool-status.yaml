"/api/worker-pool/status":
  get:
    tags:
      - Worker Pool
    summary: Get worker pool status
    description: Get detailed information about the worker pool including available workers, busy workers, and queue status
    responses:
      '200':
        description: Worker pool status retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Worker pool status retrieved successfully
                workerPool:
                  type: object
                  properties:
                    totalWorkers:
                      type: integer
                      example: 3
                    availableWorkers:
                      type: integer
                      example: 2
                    busyWorkers:
                      type: integer
                      example: 1
                    queuedJobs:
                      type: integer
                      example: 0
                    workers:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          isAvailable:
                            type: boolean
                          currentJobId:
                            type: string
                          startTime:
                            type: string
                            format: date-time
                          lastActivity:
                            type: string
                            format: date-time
      '500':
        description: Server error
