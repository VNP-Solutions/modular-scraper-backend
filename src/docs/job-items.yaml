"/api/jobs/{jobId}/items":
  get:
    tags:
      - Job Monitoring
    summary: Get job items
    description: Get scraped reservation data for a specific job
    parameters:
      - in: path
        name: jobId
        required: true
        schema:
          type: string
        description: The job ID to get items for
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Page number for pagination
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: Maximum number of items to return per page
      - in: query
        name: sortBy
        schema:
          type: string
          default: createdAt
        description: Field to sort by (e.g., guest_name, reservation_id, createdAt, etc.)
      - in: query
        name: sortOrder
        schema:
          type: string
          enum: [asc, desc]
          default: desc
        description: Sort order (asc or desc)
      - in: query
        name: search
        schema:
          type: string
        description: Search by guest name or reservation ID (partial match, case-insensitive)
      - in: query
        name: reasonForCharge
        schema:
          type: string
        description: Filter by reason for charge (partial match, case-insensitive)
    responses:
      '200':
        description: Job items retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Job items retrieved successfully
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      guest_name:
                        type: string
                      reservation_id:
                        type: string
                      confirmation_number:
                        type: string
                      check_in_date:
                        type: string
                        format: date
                      check_out_date:
                        type: string
                        format: date
                      room_type:
                        type: string
                      booking_amount:
                        type: number
                      has_card_info:
                        type: boolean
                      has_payment_info:
                        type: boolean
                metadata:
                  type: object
                  properties:
                    totalDocuments:
                      type: integer
                    currentPage:
                      type: integer
                    totalPage:
                      type: integer
                    limit:
                      type: integer
      '404':
        description: Job not found
      '500':
        description: Server error
