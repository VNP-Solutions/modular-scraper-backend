"/api/booking/stop-job":
  post:
    tags:
      - Booking Jobs
    summary: Stop booking scraping job
    description: Stop a running booking scraping job and update job status to Failed
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - jobId
            properties:
              jobId:
                type: string
                description: MongoDB ObjectId of the job to stop
                example: "507f1f77bcf86cd799439011"
    responses:
      '200':
        description: Booking scraping job stopped successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Booking scraping job stopped successfully
                jobId:
                  type: string
                  example: "507f1f77bcf86cd799439011"
                finalStatus:
                  type: string
                  example: Failed
      '400':
        description: Invalid request or job not found
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: Job ID is required
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer  
                  example: 404
                message:
                  type: string
                  example: Job with ID 507f1f77bcf86cd799439011 not found
      '500':
        description: Error stopping job
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
