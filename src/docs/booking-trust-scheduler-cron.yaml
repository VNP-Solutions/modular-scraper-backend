"/api/booking/trust-scheduler/cron/configuration":
  get:
    tags:
      - Cron Configuration
    summary: Get cron configuration
    description: Retrieve the current configuration of the booking trust verification cron job
    responses:
      '200':
        description: Configuration retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Cron configuration retrieved successfully
                data:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    schedule:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [interval, cron, specific]
                          example: interval
                        value:
                          oneOf:
                            - type: string
                              example: "0 */2 * * *"
                            - type: number
                              example: 30
                        unit:
                          type: string
                          enum: [minutes, hours, days, weeks]
                          example: minutes
                    timezone:
                      type: string
                      example: UTC
      '500':
        description: Error retrieving configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error retrieving configuration

  post:
    tags:
      - Cron Configuration
    summary: Configure cron job
    description: Update the configuration of the booking trust verification cron job
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - schedule
            properties:
              enabled:
                type: boolean
                description: Whether the cron job is enabled
                example: true
              schedule:
                type: object
                required:
                  - type
                  - value
                properties:
                  type:
                    type: string
                    enum: [interval, cron, specific]
                    description: Type of schedule configuration
                    example: interval
                  value:
                    oneOf:
                      - type: string
                        description: Cron expression or specific time (HH:MM format)
                        example: "0 */2 * * *"
                      - type: number
                        description: Interval value
                        example: 30
                  unit:
                    type: string
                    enum: [minutes, hours, days, weeks]
                    description: Required for interval type, ignored for cron and specific types
                    example: minutes
              timezone:
                type: string
                description: Timezone for the cron job (defaults to UTC)
                example: UTC
    responses:
      '200':
        description: Configuration updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Cron configuration updated successfully
                data:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    schedule:
                      type: object
                      properties:
                        type:
                          type: string
                          example: interval
                        value:
                          oneOf:
                            - type: string
                              example: "0 */2 * * *"
                            - type: number
                              example: 30
                        unit:
                          type: string
                          example: minutes
                    timezone:
                      type: string
                      example: UTC
      '400':
        description: Invalid configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: Invalid configuration
                error:
                  type: string
                  example: Invalid time format. Use HH:MM format (e.g., '09:30', '15:45')
      '500':
        description: Error updating configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error updating configuration

