"/api/booking/trust-scheduler/cron/configuration":
  get:
    tags:
      - Cron Configuration
    summary: Get cron configuration
    description: Retrieve the current configuration of the booking trust verification cron job
    responses:
      '200':
        description: Configuration retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Cron configuration retrieved successfully
                data:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    schedule:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [interval, cron, specific]
                          example: interval
                        value:
                          oneOf:
                            - type: string
                              example: "2"
                            - type: number
                              example: 30
                        unit:
                          type: string
                          enum: [minutes, hours, days, weeks]
                          example: hours
                    timezone:
                      type: string
                      example: UTC
      '500':
        description: Error retrieving configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error retrieving configuration

  post:
    tags:
      - Cron Configuration
    summary: Configure cron job
    description: |
      Update the configuration of the booking trust verification cron job.
      
      **Schedule Types:**
      
      1. **Interval**: Run every X minutes/hours/days/weeks
      2. **Cron**: Use standard cron expressions
      3. **Specific**: Run at specific times daily
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - schedule
            properties:
              enabled:
                type: boolean
                description: Whether the cron job is enabled
                example: true
              schedule:
                type: object
                required:
                  - type
                  - value
                properties:
                  type:
                    type: string
                    enum: [interval, cron, specific]
                    description: Type of schedule configuration
                    example: interval
                  value:
                    oneOf:
                      - type: string
                        description: Cron expression or specific time (HH:MM format)
                        example: "2"
                      - type: number
                        description: Interval value
                        example: 30
                  unit:
                    type: string
                    enum: [minutes, hours, days, weeks]
                    description: Required for interval type, ignored for cron and specific types
                    example: minutes
              timezone:
                type: string
                description: Timezone for the cron job (defaults to UTC)
                example: UTC
          examples:
            interval_example:
              summary: Interval - every 2 hours
              description: Configure the cron job to run every 2 hours
              value:
                enabled: true
                schedule:
                  type: interval
                  value: 2
                  unit: hours
                timezone: UTC
            cron_example:
              summary: Cron expression - every day at 9 AM
              description: Use cron expression to run every day at 9 AM
              value:
                enabled: true
                schedule:
                  type: cron
                  value: "0 9 * * *"
                timezone: UTC
            specific_example:
              summary: Specific time - 3:30 PM daily
              description: Run at 3:30 PM every day
              value:
                enabled: true
                schedule:
                  type: specific
                  value: "15:30"
                timezone: UTC
    responses:
      '200':
        description: Configuration updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Cron configuration updated successfully
                data:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
                    schedule:
                      type: object
                      properties:
                        type:
                          type: string
                          example: interval
                        value:
                          oneOf:
                            - type: string
                              example: "2"
                            - type: number
                              example: 30
                        unit:
                          type: string
                          example: hours
                    timezone:
                      type: string
                      example: UTC
      '400':
        description: Invalid configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: Invalid configuration
                error:
                  type: string
                  example: Invalid time format. Use HH:MM format (e.g., '09:30', '15:45')
      '500':
        description: Error updating configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error updating configuration

"/api/booking/trust-scheduler/cron/enabled":
  post:
    tags:
      - Cron Configuration
    summary: Enable or disable cron job
    description: Enable or disable the booking trust verification cron job
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - enabled
            properties:
              enabled:
                type: boolean
                description: Whether to enable (true) or disable (false) the cron job
                example: true
    responses:
      '200':
        description: Cron job status updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Cron job enabled successfully
                data:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      example: true
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: Enabled parameter is required and must be a boolean
      '500':
        description: Error updating cron job status
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error updating cron job status

"/api/booking/trust-scheduler/cron/status":
  get:
    tags:
      - Cron Configuration
    summary: Get cron status
    description: Get the current status of the booking trust verification cron job
    responses:
      '200':
        description: Status retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Cron status retrieved successfully
                data:
                  type: object
                  properties:
                    isRunning:
                      type: boolean
                      description: Whether the cron job is currently running
                      example: true
                    isEnabled:
                      type: boolean
                      description: Whether the cron job is enabled
                      example: true
                    currentConfig:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          example: true
                        schedule:
                          type: object
                          properties:
                            type:
                              type: string
                              example: interval
                            value:
                              oneOf:
                                - type: string
                                  example: "2"
                                - type: number
                                  example: 30
                            unit:
                              type: string
                              example: minutes
                        timezone:
                          type: string
                          example: UTC
                    nextRun:
                      type: string
                      description: Description of when the next run will occur
                      example: Next scheduled run
                    lastRun:
                      type: string
                      description: Timestamp of the last run
                      example: "2025-08-22T10:00:00Z"
      '500':
        description: Error retrieving status
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error retrieving cron status

"/api/booking/trust-scheduler/cron/trigger":
  post:
    tags:
      - Cron Configuration
    summary: Trigger cron job manually
    description: Manually trigger the booking trust verification cron job
    responses:
      '200':
        description: Cron job triggered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Manual booking trust verification triggered successfully
      '500':
        description: Error triggering cron job
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error triggering manual verification