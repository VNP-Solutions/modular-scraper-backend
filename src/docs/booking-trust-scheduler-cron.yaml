"/api/booking/trust-scheduler/cron/status":
  get:
    tags:
      - Cron Configuration
    summary: Get cron status
    description: Get the current status of the booking trust verification cron job
    responses:
      '200':
        description: Status retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Cron status retrieved successfully
                data:
                  type: object
                  properties:
                    isRunning:
                      type: boolean
                      description: Whether the cron job is currently running
                      example: true
                    isEnabled:
                      type: boolean
                      description: Whether the cron job is enabled
                      example: true
                    currentConfig:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          example: true
                        schedule:
                          type: object
                          properties:
                            type:
                              type: string
                              example: interval
                            value:
                              oneOf:
                                - type: string
                                  example: "0 */2 * * *"
                                - type: number
                                  example: 30
                            unit:
                              type: string
                              example: minutes
                        timezone:
                          type: string
                          example: UTC
                    nextRun:
                      type: string
                      description: Description of when the next run will occur
                      example: Next scheduled run
                    lastRun:
                      type: string
                      description: Timestamp of the last run
                      example: "2025-08-22T10:00:00Z"
      '500':
        description: Error retrieving status
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: Error retrieving cron status

