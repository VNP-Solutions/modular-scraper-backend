"/api/jobs/{jobId}/log":
  get:
    tags:
      - Job Monitoring
    summary: Get job log link
    description: Get the S3 URL for the job's log file
    parameters:
      - in: path
        name: jobId
        required: true
        schema:
          type: string
        description: The job ID to get log link for
    responses:
      '200':
        description: Job log link retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Job log link retrieved successfully
                job:
                  type: object
                  properties:
                    id:
                      type: string
                    status:
                      type: string
                    property_name:
                      type: string
                    log_link:
                      type: string
                      description: S3 URL of the job log file
      '404':
        description: Job not found or no log available
      '500':
        description: Server error
