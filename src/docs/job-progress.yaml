"/api/jobs/{jobId}/progress":
  get:
    tags:
      - Job Monitoring
    summary: Get job progress
    description: Get detailed progress information for a specific job including scraped data statistics
    parameters:
      - in: path
        name: jobId
        required: true
        schema:
          type: string
        description: The job ID to get progress for
        example: "507f1f77bcf86cd799439011"
    responses:
      '200':
        description: Job progress retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Job progress retrieved successfully
                job:
                  type: object
                  properties:
                    id:
                      type: string
                    status:
                      type: string
                    property_name:
                      type: string
                    portfolio_name:
                      type: string
                progress:
                  type: object
                  properties:
                    totalItems:
                      type: integer
                    itemsWithCardInfo:
                      type: integer
                    itemsWithPaymentInfo:
                      type: integer
                    completionPercentage:
                      type: integer
      '404':
        description: Job not found
      '500':
        description: Server error
