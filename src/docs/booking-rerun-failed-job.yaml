"/api/booking/rerun-failed-job":
  post:
    tags:
      - Booking Jobs
    summary: Rerun failed booking scraping job
    description: Re-execute a failed booking job with retry tracking and record recovery
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - jobId
              - ota_provider
            properties:
              jobId:
                type: string
                description: MongoDB ObjectId of the failed/partial job to rerun
                example: "507f1f77bcf86cd799439011"
              ota_provider:
                type: string
                enum: [Expedia, Agoda, Booking]
                description: OTA provider to use for scraping
                example: "Booking"
    responses:
      '200':
        description: Failed booking job rerun completed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Failed booking job rerun completed successfully
                jobId:
                  type: string
                  example: "507f1f77bcf86cd799439011"
                originalStatus:
                  type: string
                  example: Failed
                finalStatus:
                  type: string
                  example: Completed
                retryAttempt:
                  type: integer
                  example: 2
                progress:
                  type: object
                  properties:
                    totalItems:
                      type: integer
                      example: 150
                    itemsWithCardInfo:
                      type: integer
                      example: 140
                    itemsWithPaymentInfo:
                      type: integer
                      example: 135
                    completionPercentage:
                      type: integer
                      example: 90
      '400':
        description: Invalid request or job not eligible for retry
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: Job is not in Failed status. Current status: Completed
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 404
                message:
                  type: string
                  example: Job with ID 507f1f77bcf86cd799439011 not found
      '500':
        description: Error processing job rerun
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
